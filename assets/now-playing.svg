<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Now playing cassette deck">
<defs>
  <linearGradient id="chromeN" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F2F2F6"/>
    <stop offset="18%" stop-color="#D8D8E0"/>
    <stop offset="52%" stop-color="#8B8B99"/>
    <stop offset="54%" stop-color="#5C5C68"/>
    <stop offset="88%" stop-color="#A9A9B6"/>
    <stop offset="100%" stop-color="#EDEDF2"/>
  </linearGradient>
  <pattern id="scanN" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.16"/>
  </pattern>
  <filter id="softN" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="tightN" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>
  <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#241017"/><stop offset="100%" stop-color="#0B0A0E"/>
  </linearGradient>
  <linearGradient id="eqg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#C6002B"/>
    <stop offset="62%" stop-color="#FF2D55"/>
    <stop offset="100%" stop-color="#FFB800"/>
  </linearGradient>
  <style>
    @keyframes eq { 0%,100%{transform:scaleY(.12)} 50%{transform:scaleY(var(--pk,1))} }
    @keyframes rec{ 0%,100%{opacity:1} 50%{opacity:.2} }
    .eq   { animation: eq .7s ease-in-out infinite alternate; transform-origin:bottom;
             transform-box:fill-box; }
    .rec  { animation: rec 1.1s steps(1,end) infinite; }
    .mono { font-family:'Courier New',Courier,monospace; }
    .sig  { font-family: Impact,'Arial Black',sans-serif; }
    @media (prefers-reduced-motion: reduce) { .eq,.rec { animation:none } }
  </style>
</defs>
  <rect width="900" height="230" rx="10" fill="url(#deck)"/>

  <!-- cassette body -->
  <g transform="translate(40,42)">
    <rect width="430" height="148" rx="10" fill="url(#chromeN)"/>
    <rect x="7" y="7" width="416" height="134" rx="7" fill="#1A0710" stroke="#C6002B" stroke-width="1.6"/>
    <rect x="24" y="22" width="382" height="40" rx="5" fill="#C6002B"/>
    <text class="sig" x="215" y="51" text-anchor="middle" font-size="24" letter-spacing="5" fill="#FFE9EC">SIDE A — DAILY MIX</text>
    <rect x="52" y="74" width="326" height="54" rx="6" fill="#0A0308" stroke="#7A7A88" stroke-width="1.2"/>
    <g transform="translate(112,101)">
      <circle r="34" fill="#2A0C14" stroke="#C6002B" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360"
            dur="3.6s" repeatCount="indefinite"/>
        <circle r="27" fill="#3B1019" stroke="#7A7A88" stroke-width="1.4"/>
        <rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(0)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(60)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(120)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(180)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(240)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(300)"/>
        <circle r="9" fill="#D8D8E0"/><circle r="4" fill="#4A4A55"/>
      </g></g>
    <g transform="translate(318,101)">
      <circle r="34" fill="#2A0C14" stroke="#C6002B" stroke-width="2"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360"
            dur="5.4s" repeatCount="indefinite"/>
        <circle r="27" fill="#3B1019" stroke="#7A7A88" stroke-width="1.4"/>
        <rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(0)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(60)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(120)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(180)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(240)"/><rect x="-2.6" y="-25" width="5.2" height="16" rx="2.6" fill="#7A7A88" transform="rotate(300)"/>
        <circle r="9" fill="#D8D8E0"/><circle r="4" fill="#4A4A55"/>
      </g></g>
    <rect x="150" y="94" width="130" height="14" rx="3" fill="#3A1018"/>
  </g>

  <!-- tracklist + eq -->
  <g>
    <circle class="rec" cx="518" cy="34" r="6" fill="#FF2D55"/>
    <text class="sig" x="534" y="40" font-size="19" letter-spacing="3.5" fill="#FFE9EC">NOW PLAYING</text>
    <text class="mono" x="512" y="62" font-size="14" fill="#7A7A88">TRK 01</text><text class="mono" x="574" y="62" font-size="14" fill="#FFE9EC">UI/UX design systems, shipped</text><text class="mono" x="512" y="88" font-size="14" fill="#7A7A88">TRK 02</text><text class="mono" x="574" y="88" font-size="14" fill="#FFE9EC">Angular + TypeScript builds</text><text class="mono" x="512" y="114" font-size="14" fill="#7A7A88">TRK 03</text><text class="mono" x="574" y="114" font-size="14" fill="#FFE9EC">Learning in public, daily</text><text class="mono" x="512" y="140" font-size="14" fill="#7A7A88">TRK 04</text><text class="mono" x="574" y="140" font-size="14" fill="#FFE9EC">Coffee. Playlists. Pixels.</text>
  </g>
