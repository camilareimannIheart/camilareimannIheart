<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="ON AIR studio banner">
<defs>
  <linearGradient id="chromeH" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#F2F2F6"/>
    <stop offset="18%" stop-color="#D8D8E0"/>
    <stop offset="52%" stop-color="#8B8B99"/>
    <stop offset="54%" stop-color="#5C5C68"/>
    <stop offset="88%" stop-color="#A9A9B6"/>
    <stop offset="100%" stop-color="#EDEDF2"/>
  </linearGradient>
  <pattern id="scanH" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity="0.16"/>
  </pattern>
  <filter id="softH" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <filter id="tightH" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>
  <radialGradient id="wall" cx="50%" cy="34%" r="78%">
    <stop offset="0%"   stop-color="#3A0C18"/>
    <stop offset="55%"  stop-color="#1C0910"/>
    <stop offset="100%" stop-color="#0B0A0E"/>
  </radialGradient>
  <linearGradient id="signface" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FF4D6A"/>
    <stop offset="48%"  stop-color="#C6002B"/>
    <stop offset="100%" stop-color="#7E0019"/>
  </linearGradient>
  <style>
    @keyframes tw   { 0%,100%{opacity:.15} 50%{opacity:.95} }
    @keyframes buzz { 0%,42%,46%,100%{opacity:1} 44%{opacity:.35} 74%{opacity:.55} 76%{opacity:1} }
    @keyframes halo { 0%,100%{opacity:.30} 50%{opacity:.85} }
    @keyframes ping { 0%{opacity:0;transform:scale(.55)} 30%{opacity:.95} 100%{opacity:0;transform:scale(1.35)} }
    @keyframes beat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.22)} 28%{transform:scale(1)} 42%{transform:scale(1.14)} }
    @keyframes drift{ 0%{transform:translateY(0);opacity:0} 18%{opacity:.9} 100%{transform:translateY(-46px);opacity:0} }
    @keyframes roll { 0%{opacity:.55} 50%{opacity:1} 100%{opacity:.55} }
    .tw    { animation: tw 3s ease-in-out infinite; }
    .ping  { animation: ping 1.7s ease-out infinite; transform-origin:center; }
    .beat  { animation: beat 1.5s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
    .buzz  { animation: buzz 4.5s steps(1,end) infinite; }
    .halo  { animation: halo 2.6s ease-in-out infinite; }
    .roll  { animation: roll 2s ease-in-out infinite; }
    .sig   { font-family: Impact, 'Arial Black', 'Haettenschweiler', sans-serif; }
    .mono  { font-family: 'Courier New', Courier, monospace; }
    @media (prefers-reduced-motion: reduce) {
      .tw,.ping,.beat,.buzz,.halo,.roll,.drift { animation: none; }
    }
  </style>
</defs>

  <rect width="900" height="300" rx="10" fill="url(#wall)"/>
  <g opacity="0.9"><circle class="tw" cx="601.2" cy="65.0" r="1.4" fill="#FFE9EC" style="animation-duration:3.27s;animation-delay:-3.06s"/><circle class="tw" cx="327.9" cy="154.4" r="1.1" fill="#FFE9EC" style="animation-duration:3.13s;animation-delay:-1.29s"/><circle class="tw" cx="90.9" cy="247.0" r="1.4" fill="#FFE9EC" style="animation-duration:3.93s;animation-delay:-1.74s"/><circle class="tw" cx="762.6" cy="79.3" r="1.4" fill="#FFE9EC" style="animation-duration:2.34s;animation-delay:-2.75s"/><circle class="tw" cx="807.8" cy="41.1" r="0.9" fill="#FFE9EC" style="animation-duration:3.64s;animation-delay:-2.16s"/><circle class="tw" cx="628.8" cy="240.4" r="1.1" fill="#FFE9EC" style="animation-duration:4.60s;animation-delay:-0.78s"/><circle class="tw" cx="546.9" cy="136.9" r="1.8" fill="#FFE9EC" style="animation-duration:3.74s;animation-delay:-2.50s"/><circle class="tw" cx="726.0" cy="99.2" r="0.9" fill="#FFE9EC" style="animation-duration:3.10s;animation-delay:-2.23s"/><circle class="tw" cx="268.3" cy="124.3" r="1.4" fill="#FFE9EC" style="animation-duration:4.01s;animation-delay:-0.48s"/><circle class="tw" cx="372.4" cy="217.4" r="0.9" fill="#FFE9EC" style="animation-duration:4.40s;animation-delay:-0.99s"/><circle class="tw" cx="828.9" cy="146.3" r="1.8" fill="#FFE9EC" style="animation-duration:4.57s;animation-delay:-1.70s"/><circle class="tw" cx="350.2" cy="146.2" r="1.1" fill="#FFE9EC" style="animation-duration:3.55s;animation-delay:-3.18s"/><circle class="tw" cx="709.9" cy="231.5" r="1.8" fill="#FFE9EC" style="animation-duration:3.94s;animation-delay:-1.43s"/><circle class="tw" cx="725.9" cy="68.8" r="0.9" fill="#FFE9EC" style="animation-duration:3.60s;animation-delay:-1.82s"/><circle class="tw" cx="320.1" cy="216.4" r="0.9" fill="#FFE9EC" style="animation-duration:3.81s;animation-delay:-0.07s"/><circle class="tw" cx="670.4" cy="180.3" r="1.8" fill="#FFE9EC" style="animation-duration:3.42s;animation-delay:-1.01s"/><circle class="tw" cx="135.9" cy="173.5" r="1.1" fi